<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090c15;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 10px;
    }
    #hud {
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 8px 8px 0 0;
      padding: 8px 14px;
      font-size: 13px;
    }
    .badge { font-weight: bold; font-family: monospace; font-size: 16px; }
    .face-btn {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 16px;
    }
    #board-container {
      background: #0a0f1d;
      border: 1px solid #1e293b;
      border-top: none;
      padding: 12px;
      border-radius: 0 0 8px 8px;
      display: flex;
      justify-content: center;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(9, 32px);
      grid-template-rows: repeat(9, 32px);
      gap: 3px;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #1e293b;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .cell:hover { background: #334155; }
    .cell.revealed { background: #0f172a; cursor: default; }
    .cell.mine { background: #ef4444; }
    .c1 { color: #38bdf8; }
    .c2 { color: #10b981; }
    .c3 { color: #f43f5e; }
    .c4 { color: #a855f7; }
    .c5 { color: #f59e0b; }
    #flag-btn {
      margin-top: 10px;
      padding: 8px 16px;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    #flag-btn.active { background: #f59e0b; color: #000; font-weight: bold; }
  </style>
</head>
<body>
  <div id="hud">
    <div style="color:#ef4444;">💣 <span id="mines-count" class="badge">10</span></div>
    <button class="face-btn" id="face" onclick="resetGame()">😊</button>
    <div style="color:#38bdf8;">⏱️ <span id="timer" class="badge">0</span></div>
  </div>

  <div id="board-container">
    <div id="grid"></div>
  </div>

  <button id="flag-btn" onclick="toggleFlagMode()">Flag Mode: OFF (Press F)</button>

  <script>
    const ROWS = 9, COLS = 9, MINES = 10;
    const gridEl = document.getElementById('grid');
    const minesEl = document.getElementById('mines-count');
    const timerEl = document.getElementById('timer');
    const faceEl = document.getElementById('face');
    const flagBtn = document.getElementById('flag-btn');

    let board = [];
    let isGameOver = false;
    let flagMode = false;
    let timer = 0, timerInterval = null;
    let firstClick = true;

    function toggleFlagMode() {
      flagMode = !flagMode;
      flagBtn.textContent = flagMode ? 'Flag Mode: ON (🚩)' : 'Flag Mode: OFF (Press F)';
      flagBtn.classList.toggle('active', flagMode);
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'KeyF') toggleFlagMode();
      if (e.code === 'KeyR') resetGame();
    });

    function resetGame() {
      clearInterval(timerInterval);
      timer = 0;
      timerEl.textContent = '0';
      timerInterval = null;
      firstClick = true;
      isGameOver = false;
      faceEl.textContent = '😊';
      board = [];
      gridEl.innerHTML = '';

      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
          board[r][c] = { mine: false, revealed: false, flagged: false, count: 0 };
          const div = document.createElement('div');
          div.className = 'cell';
          div.dataset.r = r;
          div.dataset.c = c;
          div.addEventListener('click', () => handleClick(r, c));
          div.addEventListener('contextmenu', e => { e.preventDefault(); handleRightClick(r, c); });
          gridEl.appendChild(div);
        }
      }
      minesEl.textContent = MINES;
    }

    function plantMines(safeR, safeC) {
      let planted = 0;
      while (planted < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if (!board[r][c].mine && !(r === safeR && c === safeC)) {
          board[r][c].mine = true;
          planted++;
        }
      }

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].mine) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].mine) count++;
              }
            }
            board[r][c].count = count;
          }
        }
      }
    }

    function handleClick(r, c) {
      if (isGameOver) return;
      if (flagMode) { handleRightClick(r, c); return; }

      const cell = board[r][c];
      if (cell.flagged || cell.revealed) return;

      if (firstClick) {
        firstClick = false;
        plantMines(r, c);
        timerInterval = setInterval(() => { timer++; timerEl.textContent = timer; }, 1000);
      }

      if (cell.mine) {
        // Game Over
        isGameOver = true;
        clearInterval(timerInterval);
        faceEl.textContent = '😵';
        revealAll();
        return;
      }

      reveal(r, c);
      checkWin();
    }

    function handleRightClick(r, c) {
      if (isGameOver || board[r][c].revealed) return;
      board[r][c].flagged = !board[r][c].flagged;
      renderCell(r, c);

      let flags = 0;
      board.forEach(row => row.forEach(c => { if (c.flagged) flags++; }));
      minesEl.textContent = Math.max(0, MINES - flags);
    }

    function reveal(r, c) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
      const cell = board[r][c];
      if (cell.revealed || cell.flagged || cell.mine) return;

      cell.revealed = true;
      renderCell(r, c);

      if (cell.count === 0) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            reveal(r + dr, c + dc);
          }
        }
      }
    }

    function renderCell(r, c) {
      const idx = r * COLS + c;
      const el = gridEl.children[idx];
      const cell = board[r][c];

      if (cell.revealed) {
        el.className = 'cell revealed ' + (cell.count > 0 ? 'c' + cell.count : '');
        el.textContent = cell.mine ? '💣' : (cell.count > 0 ? cell.count : '');
      } else if (cell.flagged) {
        el.textContent = '🚩';
      } else {
        el.textContent = '';
      }
    }

    function revealAll() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].mine) {
            board[r][c].revealed = true;
            renderCell(r, c);
          }
        }
      }
    }

    function checkWin() {
      let unrevealed = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].revealed) unrevealed++;
        }
      }
      if (unrevealed === MINES) {
        isGameOver = true;
        clearInterval(timerInterval);
        faceEl.textContent = '😎';
      }
    }

    resetGame();
  </script>
</body>
</html>
