<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>T-Rex Horizon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 10px;
    }
    #hud {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px 8px 0 0;
      padding: 10px 16px;
      font-size: 13px;
    }
    .score-badge { color: #10b981; font-weight: bold; }
    #canvas-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 5/4;
      background: #060911;
      border: 1px solid #1e293b;
      border-top: none;
      cursor: pointer;
    }
    canvas { width: 100%; height: 100%; display: block; }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 9, 17, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    #overlay.active { display: flex; }
    .btn {
      background: #10b981;
      color: #060911;
      font-weight: bold;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    #touch-bar {
      display: none;
      width: 100%;
      max-width: 500px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 10px;
      gap: 10px;
    }
    .t-btn {
      flex: 1;
      height: 44px;
      background: #1e293b;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
    }
    @media (max-width: 600px) { #touch-bar { display: flex; } }
  </style>
</head>
<body>
  <div id="hud">
    <div>Distance: <span id="score" class="score-badge">0m</span></div>
    <div>Best: <span id="best" style="color:#f59e0b; font-weight:bold;">0m</span></div>
    <div>Click / Space to Jump</div>
  </div>

  <div id="canvas-container" onclick="jump()">
    <canvas id="game" width="500" height="400"></canvas>
    <div id="overlay">
      <h2 style="color:#ef4444; font-size:24px; margin-bottom:8px;">Crashed in Canyon</h2>
      <p id="modal-desc" style="color:#94a3b8; margin-bottom:16px;">Distance: 0m</p>
      <button class="btn" onclick="event.stopPropagation(); resetGame();">Run Again (R)</button>
    </div>
  </div>

  <div id="touch-bar">
    <button class="t-btn" style="background:#10b981; color:#060911;" onclick="jump()">JUMP</button>
    <button class="t-btn" id="btn-duck">DUCK</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const modalDesc = document.getElementById('modal-desc');

    let dino = { x: 50, y: 280, w: 36, h: 44, vy: 0, gravity: 0.65, jumpF: -11, grounded: true, ducking: false };
    let obstacles = [];
    let speed = 5.5;
    let score = 0;
    let best = parseInt(localStorage.getItem('dino_hi') || '0', 10);
    bestEl.textContent = best + 'm';
    let nextObs = 200;
    let isGameOver = false;

    let audioCtx = null;
    function snd(f, dur) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    function jump() {
      if (isGameOver) return;
      if (dino.grounded && !dino.ducking) {
        dino.vy = dino.jumpF;
        dino.grounded = false;
        snd(350, 0.1);
      }
    }

    function resetGame() {
      dino.y = 280;
      dino.vy = 0;
      dino.grounded = true;
      dino.ducking = false;
      dino.h = 44;
      obstacles = [];
      speed = 5.5;
      score = 0;
      nextObs = 200;
      isGameOver = false;
      scoreEl.textContent = '0m';
      overlay.classList.remove('active');
    }

    window.addEventListener('keydown', e => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
        e.preventDefault();
        if (isGameOver) resetGame();
        else jump();
      } else if (['ArrowDown', 'KeyS'].includes(e.code) && dino.grounded) {
        dino.ducking = true;
        dino.h = 24;
        dino.y = 300;
      } else if (e.code === 'KeyR' && isGameOver) resetGame();
    });

    window.addEventListener('keyup', e => {
      if (['ArrowDown', 'KeyS'].includes(e.code)) {
        dino.ducking = false;
        dino.h = 44;
        dino.y = 280;
      }
    });

    const btnDuck = document.getElementById('btn-duck');
    btnDuck.addEventListener('pointerdown', () => {
      if (dino.grounded) { dino.ducking = true; dino.h = 24; dino.y = 300; }
    });
    btnDuck.addEventListener('pointerup', () => {
      dino.ducking = false; dino.h = 44; dino.y = 280;
    });

    function loop() {
      if (!isGameOver) {
        score += 0.25;
        const cur = Math.floor(score);
        scoreEl.textContent = cur + 'm';
        speed = Math.min(10.5, 5.5 + cur * 0.0035);

        if (cur > best) {
          best = cur;
          bestEl.textContent = best + 'm';
          localStorage.setItem('dino_hi', String(best));
        }

        if (!dino.grounded) {
          dino.vy += dino.gravity;
          dino.y += dino.vy;
          if (dino.y >= 280) {
            dino.y = 280;
            dino.vy = 0;
            dino.grounded = true;
          }
        }

        nextObs -= speed;
        if (nextObs <= 0) {
          const isBird = cur > 250 && Math.random() < 0.35;
          if (isBird) {
            obstacles.push({ x: 520, y: Math.random() < 0.5 ? 255 : 225, w: 32, h: 20, type: 'bird' });
          } else {
            obstacles.push({ x: 520, y: 280, w: 20, h: 44, type: 'cactus' });
          }
          nextObs = Math.floor(Math.random() * 150) + 180;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.x -= speed;

          // Box collision
          if (
            dino.x + dino.w - 6 >= obs.x &&
            dino.x + 6 <= obs.x + obs.w &&
            dino.y + dino.h >= obs.y &&
            dino.y <= obs.y + obs.h
          ) {
            isGameOver = true;
            snd(150, 0.3);
            modalDesc.textContent = 'Distance: ' + Math.floor(score) + 'm';
            overlay.classList.add('active');
          }

          if (obs.x < -40) obstacles.splice(i, 1);
        }
      }

      // Draw
      ctx.fillStyle = '#060911';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ground
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, 324); ctx.lineTo(500, 324); ctx.stroke();

      // Dino
      ctx.fillStyle = '#10b981';
      ctx.fillRect(dino.x, dino.y, dino.w, dino.h);

      // Eye
      ctx.fillStyle = '#060911';
      ctx.fillRect(dino.x + dino.w - 10, dino.y + 4, 3, 3);

      // Obstacles
      obstacles.forEach(o => {
        ctx.fillStyle = o.type === 'cactus' ? '#059669' : '#f43f5e';
        ctx.fillRect(o.x, o.y, o.w, o.h);
      });

      requestAnimationFrame(loop);
    }

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
